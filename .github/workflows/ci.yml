name: Kairo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KAIRO_ENV: ci
      KAIRO_ORIGIN: http://localhost:4173
      KAIRO_PREVIEW_ID: ci-${{ github.run_id }}
      PREVIEW_DATABASE_URL: postgresql://preview@localhost/kairo-preview-ci-${{ github.run_id }}
      PREVIEW_STORAGE_ENDPOINT: https://storage.example.test
      PREVIEW_STORAGE_BUCKET: kairo-preview-ci-${{ github.run_id }}
      KAIRO_PRODUCTION_ORIGIN: https://kairo.example.com
      KAIRO_PRODUCTION_DATABASE_URL: postgresql://production@production.example.test/kairo-production
      KAIRO_PRODUCTION_STORAGE_BUCKET: kairo-production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check routes and types
        run: bun run check

      - name: Validate preview isolation
        run: bun run test:preview

      - name: Validate release metadata
        run: bun run test:release

      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium

      - name: Run unit, integration, database, and browser tests
        run: bun run test

      - name: Build production output
        run: bun run build

      - name: Verify clean checkout
        run: bun run verify:clean
